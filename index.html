<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mehak</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* page base */
    :root{ --bg:#000; --muted:#9ea6ad; --glass: rgba(20,20,20,0.55) }
    html,body{ height:100%; }
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:#fff;
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
      overflow:hidden;
      position:relative;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Canvas (starry/orbs) behind everything */
    canvas#bg {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:0;
    }

    /* small corner texts */
    .corner {
      position: absolute;
      z-index: 3;
      color: var(--muted);
      font-size: 12px;
      line-height:1.2;
    }
    .corner.left { left: 16px; top: 14px; text-align:left; }
    .corner.right { right: 16px; top: 14px; text-align:right; }

    /* HERO container centered perfectly */
    .hero {
      z-index: 2;                 /* above canvas */
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;         /* ensures true vertical centering */
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    /* MEHAK title - big centered logo style */
    .genshin-title {
      font-family: "Cinzel Decorative", serif;
      font-weight: 700;
      font-size: clamp(3.6rem, 12vw, 9.6rem);
      line-height: 0.95;
      margin: 0;
      letter-spacing: 6px;
      /* gradient fill like the Genshin example */
      background: linear-gradient(to bottom, #ffffff 18%, #c8e9ff 48%, #1f4f9b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 0 18px rgba(180,210,255,0.55),
        0 0 44px rgba(70,120,220,0.38),
        0 10px 40px rgba(0,0,0,0.6);
      transform-origin:center;
      display:inline-block;
      z-index:2;
    }

    .subtitle {
      color: #bfc7cc;
      font-size: 13px;
      letter-spacing: 2px;
      margin-top: -6px;
      z-index:2;
    }

    /* Counter + button - placed below title inside hero */
    #counterBox {
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(10,14,18,0.6);
      border: 1px solid rgba(255,255,255,0.04);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 6px 30px rgba(10,20,30,0.6);
      font-family: "Roboto", sans-serif;
      color: #dbe6ee;
      font-size: 14px;
    }

    /* your exact neu-button look (kept as requested) */
    .neu-button {
      background-color: #e0e0e0;
      border-radius: 50px;
      box-shadow: inset 4px 4px 10px #bcbcbc, inset -4px -4px 10px #ffffff;
      color: #4d4d4d;
      cursor: pointer;
      font-size: 16px;
      padding: 12px 28px;
      transition: all 0.2s ease-in-out;
      border: 2px solid rgb(206, 206, 206);
      font-weight: bold;
    }
    .neu-button:hover {
      box-shadow: inset 2px 2px 5px #bcbcbc, inset -2px -2px 5px #ffffff, 2px 2px 5px #bcbcbc, -2px -2px 5px #ffffff;
      transform: translateY(-2px);
    }
    .neu-button:active{ transform: translateY(0); }

    /* bottom footer */
    .footer {
      position:absolute;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:3;
      color:var(--muted);
      font-size:12px;
      text-align:center;
      max-width:780px;
      padding:0 10px;
    }

    /* responsiveness tweaks */
    @media (max-width:720px){
      .corner{ font-size:11px; max-width:140px; opacity:0.95 }
      .genshin-title{ font-size: clamp(2.2rem, 16vw, 5rem); letter-spacing:3px; }
      #counterBox{ gap: 10px; padding: 8px 12px; font-size:13px; }
      .neu-button{ padding:10px 18px; font-size:14px; }
      .footer{ font-size:11px; bottom:10px; }
    }
  </style>
</head>
<body>

  <!-- canvas for stars/orbs -->
  <canvas id="bg"></canvas>

  <!-- small corner texts -->
  <div class="corner left">
    <div>The silence of books</div>
    <div>Where light refuses entry</div>
    <div>The shadow laughs</div>
  </div>
  <div class="corner right">
    <div>Ink stains the soul,</div>
    <div>pages burn quietly,</div>
    <div>Fyodor watches.</div>
  </div>

  <!-- centered hero area (perfectly centered) -->
  <main class="hero" role="main" aria-labelledby="title">
    <h1 id="title" class="genshin-title">Mehak</h1>
    <div class="subtitle">A cute girly existence</div>

    <!-- counter box moved below title (centered) -->
    <div id="counterBox" aria-live="polite">
      <div>Sorry Counter: <strong id="counter">50</strong></div>
      <button id="sorryBtn" class="neu-button" aria-label="Say Sorry">Say Sorry</button>
    </div>
  </main>

  <div class="footer">
    Words dissolve into silence.<br>
    The river carries guilt away.<br>
    — A whisper Fyodor left behind.
  </div>

  <!-- click sound -->
  <audio id="clickSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>

  <script>
    /* Canvas star + orb scene (resilient to resizing) */
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d', { alpha: true });

    let W = 0, H = 0;
    let stars = [];
    let orbs = [];

    function resize() {
      W = canvas.width = innerWidth;
      H = canvas.height = innerHeight;
      // re-create particles for consistent placement
      createStars(260);
      createOrbs([
        { x: W * 0.22, y: H * 0.35, r: Math.min(300, Math.max(120, W * 0.18)), color: "hsla(215,70%,65%,0.22)" },
        { x: W * 0.78, y: H * 0.33, r: Math.min(360, Math.max(140, W * 0.22)), color: "hsla(200,60%,60%,0.22)" },
        { x: W * 0.5,  y: H * 0.75, r: Math.min(220, Math.max(100, W * 0.14)), color: "hsla(280,65%,68%,0.20)" },
      ]);
    }

    window.addEventListener('resize', resize, { passive: true });

    /* create twinkling stars */
    function createStars(count){
      stars = [];
      for(let i=0;i<count;i++){
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random()*1.6 + 0.4,
          alpha: Math.random()*0.8 + 0.2,
          tw: (Math.random()*0.03) + 0.004,
          dir: Math.random() > 0.5 ? 1 : -1
        });
      }
    }

    /* create orbs */
    function createOrbs(defs){
      orbs = [];
      defs.forEach(d=>{
        orbs.push({
          x: d.x,
          y: d.y,
          r: d.r,
          color: d.color,
          dx: (Math.random()-0.5) * 0.9,
          dy: (Math.random()-0.5) * 0.9
        });
      });
    }

    // initial resize to set arrays
    resize();

    function draw(){
      // soft clearing
      ctx.clearRect(0,0,W,H);

      // faint background wash to avoid harsh black edges
      // ctx.fillStyle = 'rgba(0,0,0,0.2)';
      // ctx.fillRect(0,0,W,H);

      // draw orbs (behind stars)
      orbs.forEach(o=>{
        // drift
        o.x += o.dx; o.y += o.dy;
        // bounce
        if(o.x < -o.r*0.5 || o.x > W + o.r*0.5) o.dx *= -1;
        if(o.y < -o.r*0.5 || o.y > H + o.r*0.5) o.dy *= -1;

        const g = ctx.createRadialGradient(o.x, o.y, Math.max(2, o.r*0.15), o.x, o.y, o.r);
        g.addColorStop(0, o.color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
        ctx.fill();
      });

      // draw stars on top of orbs (twinkle)
      stars.forEach(s=>{
        s.alpha += s.tw * s.dir;
        if(s.alpha > 1){ s.alpha = 1; s.dir *= -1; }
        if(s.alpha < 0.25){ s.alpha = 0.25; s.dir *= -1; }
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    draw();

    /* Counter + webhook + sound logic */
    let count = 50;
    const counterEl = document.getElementById('counter');
    const sorryBtn = document.getElementById('sorryBtn');
    const clickSound = document.getElementById('clickSound');

    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1418334231238803556/jhhpmTuQXDjovRV2Nu9-enc5oKJielkHdyIwMVETSGkhzc03jPCErxh4BzeOTHS0S-h9";

    sorryBtn.addEventListener('click', () => {
      if(count > 0){ count--; counterEl.textContent = count; }
      clickSound.currentTime = 0;
      clickSound.play();
      // send to discord (best-effort)
      fetch(DISCORD_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: `🙏 Someone said sorry! Remaining counter: ${count}` })
      }).catch(e => console.warn('discord error', e));
    });

    // ensure centering if font metrics shift after load (helps precise visual centering)
    window.addEventListener('load', () => {
      // small repaint to ensure hero stays centered after fonts load
      requestAnimationFrame(()=>{ /* nop */ });
    });
  </script>
</body>
</html>
